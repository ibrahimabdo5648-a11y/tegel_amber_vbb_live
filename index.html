<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Abfahrtsanzeige</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
body{font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;color:#ffad18}
.board{width:100vw;height:100vh;background:#050505;display:flex;flex-direction:column;position:relative}
.top{height:15%;min-height:70px;background:#050505;display:grid;grid-template-columns:20% 55% 25%;align-items:center;padding:0 3.5%;border-bottom:2px solid #ffad18;box-shadow:none}
.top>div{color:#ffad18;font-family:"Courier New",monospace;font-size:clamp(28px,4vw,64px);font-weight:900;white-space:nowrap;text-shadow:0 0 5px #ff8c00,0 0 12px rgba(255,126,0,.65)}
.top .right{text-align:right}
.screen{flex:1;background:#050505;position:relative;overflow:hidden;padding:1.2% 2.2% 5%;box-shadow:none}
.screen:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(circle,rgba(255,174,30,.5) 0 1px,transparent 1.3px);background-size:5px 5px;mix-blend-mode:screen}
.rows{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-evenly}
.row{display:grid;grid-template-columns:18% 58% 24%;align-items:center;height:13.2%;min-height:45px;color:#ffad18;font-family:"Courier New",monospace;font-weight:700;letter-spacing:.02em;text-shadow:0 0 5px #ff8c00,0 0 12px rgba(255,126,0,.65)}
.line{font-size:clamp(21px,3.2vw,55px);white-space:nowrap}
.dest{font-size:clamp(20px,3.05vw,52px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{text-align:right;font-size:clamp(22px,3.15vw,55px);white-space:nowrap}
.badge{display:inline-block;min-width:3.1em;margin-right:.45em;color:#ffad18}
.message{font-size:clamp(19px,2.6vw,44px);color:#ffad18;font-family:"Courier New",monospace;text-align:center;text-shadow:0 0 6px #ff8c00}
.info{position:absolute;z-index:3;left:2.5%;right:2.5%;bottom:1.5%;display:flex;gap:2.2vw;align-items:center;color:#ffad18;font-family:"Courier New",monospace;font-weight:900;font-size:clamp(18px,2.4vw,40px);text-shadow:0 0 5px #ff8c00,0 0 12px rgba(255,126,0,.65)}
.weather{white-space:nowrap}
.quote{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs{position:fixed;z-index:20;right:10px;bottom:10px;width:34px;height:30px;padding:0;border:1px solid #ffad18;background:#050505;color:#ffad18;border-radius:2px;cursor:pointer;font:900 21px/28px Arial,sans-serif;text-shadow:0 0 4px #ff8c00}
.fs:active{transform:scale(.96)}
@media(max-width:700px){.top{grid-template-columns:25% 45% 30%;padding:0 2%;height:14%}.screen{padding:2% 1.5% 7%}.row{grid-template-columns:20% 55% 25%}.top>div{font-size:clamp(18px,5vw,34px)}.line{font-size:clamp(14px,4.4vw,27px)}.dest{font-size:clamp(13px,4vw,25px)}.count{font-size:clamp(15px,4.2vw,27px)}.info{left:2%;bottom:1.5%;font-size:clamp(12px,3.4vw,22px);gap:3vw}.fs{font-size:clamp(11px,3vw,18px)}}
</style>
</head>
<body>
<div class="board">
  <div class="top">
    <div class="title">Linie</div>
    <div class="middle">Ziel</div>
    <div class="right">Abfahrt in</div>
  </div>
  <div class="screen"><div class="rows" id="rows"></div></div>
  <div class="info">
    <span id="clock">--:--:--</span>
    <span class="weather" id="weather">WETTER --°C</span>
    <span class="quote" id="quote">„Jeder Weg beginnt mit dem ersten Schritt.“</span>
    <button class="fs" id="fs" aria-label="Vollbild" title="Vollbild">⛶</button>
  </div>
</div>
<script>
const API="https://v6.vbb.transport.rest";
const S_TEGEL="900089303";
const U_ALT_TEGEL="900089301";
let departures=[];

const $=id=>document.getElementById(id);
function dep(x){return x.when||x.plannedWhen}
function isFuture(x){const t=dep(x);return t && new Date(t).getTime()>=Date.now()-30000}
function minutes(x){return Math.max(0,Math.round((new Date(dep(x)).getTime()-Date.now())/60000))}
function s25(x){return x?.line?.name==="S25" && /teltow\s*stadt/i.test(x.direction||"")}
function replacementBus(x){
  const d=(x.direction||"").toLowerCase();
  const n=(x.line?.name||"").toLowerCase();
  const p=(x.line?.product||"").toLowerCase();
  return /kurt[-\s]?schumacher[-\s]?platz/.test(d) && (p==="bus" || n.includes("u6") || n.includes("ersatz") || n.includes("bus"));
}
function sortByTime(a,b){return new Date(dep(a))-new Date(dep(b))}

function updateClock(){
  $("clock").textContent=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
setInterval(updateClock,1000);updateClock();

async function updateWeather(){
  try{
    const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=52.56&longitude=13.29&current=temperature_2m,weather_code&timezone=Europe%2FBerlin",{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    const t=Math.round(d.current.temperature_2m);
    const code=d.current.weather_code;
    const icon=code===0?"☀":code<=3?"☁":code<=48?"≋":code<=67?"☂":code<=77?"❄":"☂";
    $("weather").textContent=`${icon} ${t}°C`;
  }catch(e){$("weather").textContent="WETTER --°C";}
}
updateWeather();
setInterval(updateWeather,600000);

const quotes=[
  "„Jeder Weg beginnt mit dem ersten Schritt.“",
  "„Der nächste Schritt bringt dich weiter.“",
  "„Neue Wege, neue Möglichkeiten.“",
  "„Manchmal ist der Weg das Ziel.“",
  "„Heute ist ein guter Tag für einen neuen Weg.“",
  "„Gute Reise!“"
];
function updateQuote(){
  const day=Math.floor(Date.now()/86400000);
  $("quote").textContent=quotes[day%quotes.length];
}
updateQuote();

function rowHTML(x){
  const m=minutes(x);
  const isBus=x.kind==="bus";
  return `<div class="row"><div class="line"><span class="badge">${isBus?"U6":"S25"}</span></div><div class="dest">${isBus?"KURT-SCHUMACHER-PLATZ":"TELTOW STADT"}</div><div class="count">${m<=0?"JETZT":m+" min"}</div></div>`;
}
function render(){
  const combined=departures.filter(isFuture).sort(sortByTime).slice(0,7);
  $("rows").innerHTML=combined.length?combined.map(rowHTML).join(""):`<div class="message">KEINE ABFAHRTEN VERFÜGBAR</div>`;
}

async function get(id){
  const r=await fetch(`${API}/stops/${id}/departures?duration=90&results=50&remarks=true&language=de`,{cache:"no-store"});
  if(!r.ok) throw new Error(r.status);
  return (await r.json()).departures||[];
}
async function refresh(){
  try{
    const [s,b]=await Promise.all([get(S_TEGEL),get(U_ALT_TEGEL)]);
    departures=[
      ...s.filter(s25).map(x=>({...x,kind:"s25"})),
      ...b.filter(replacementBus).map(x=>({...x,kind:"bus"}))
    ].sort(sortByTime);
    render();
  }catch(e){
    console.error(e);
    if(!departures.length) $("rows").innerHTML=`<div class="message">LIVE-DATEN NICHT ERREICHBAR</div>`;
  }
}
refresh();
setInterval(refresh,20000);
setInterval(render,1000);
$("fs").addEventListener("click",async()=>{try{if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen();}catch(e){console.error(e)}});
</script>
</body>
</html>
